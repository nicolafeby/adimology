name: Deploy to Home Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: adimology-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, linux, x64, adimology]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      APP_PORT: ${{ vars.APP_PORT || '3100' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STOCKBIT_JWT_TOKEN: ${{ secrets.STOCKBIT_JWT_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GEMINI_STORY_MODELS: ${{ vars.GEMINI_STORY_MODELS }}
      SCREENER_UNIVERSE_LIMIT: ${{ vars.SCREENER_UNIVERSE_LIMIT }}
      SCREENER_DEEP_LIMIT: ${{ vars.SCREENER_DEEP_LIMIT }}
      SCREENER_AI_LIMIT: ${{ vars.SCREENER_AI_LIMIT }}

    steps:
      - name: Check deployment configuration
        run: |
          test -n "$DEPLOY_PATH" || { echo "GitHub variable DEPLOY_PATH is required"; exit 1; }
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute path"; exit 1 ;;
          esac
          case "$APP_PORT" in
            ''|*[!0-9]*) echo "APP_PORT must be a number"; exit 1 ;;
          esac
          test "$APP_PORT" -ge 1024 -a "$APP_PORT" -le 65535 || { echo "APP_PORT must be between 1024 and 65535"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "NEXT_PUBLIC_SUPABASE_URL is required"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is required"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is required"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is required"; exit 1; }
          test -n "$AUTH_SECRET" || { echo "AUTH_SECRET is required"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Check port on first deployment
        run: |
          if ! npx --no-install pm2 describe adimology >/dev/null 2>&1; then
            APP_PORT="$APP_PORT" node <<'NODE'
          const net = require('node:net');
          const port = Number(process.env.APP_PORT);
          const server = net.createServer();
          server.once('error', (error) => {
            console.error(`Port ${port} tidak tersedia: ${error.message}`);
            process.exit(1);
          });
          server.listen(port, '0.0.0.0', () => {
            console.log(`Port ${port} tersedia`);
            server.close();
          });
          NODE
          else
            echo "PM2 app adimology sudah ada; port akan dipertahankan saat reload"
          fi

      - name: Create release
        id: release
        run: |
          RELEASE_PATH="$DEPLOY_PATH/releases/${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RELEASE_PATH"
          cp -R .next/standalone/. "$RELEASE_PATH/"
          mkdir -p "$RELEASE_PATH/.next"
          cp -R .next/static "$RELEASE_PATH/.next/static"
          cp -R public "$RELEASE_PATH/public"
          printf 'release_path=%s\n' "$RELEASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Write production environment
        env:
          RELEASE_PATH: ${{ steps.release.outputs.release_path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const names = [
            'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY', 'STOCKBIT_JWT_TOKEN', 'CRON_SECRET',
            'GEMINI_API_KEY', 'AUTH_SECRET',
            'GEMINI_STORY_MODELS', 'SCREENER_UNIVERSE_LIMIT',
            'SCREENER_DEEP_LIMIT', 'SCREENER_AI_LIMIT'
          ];
          const contents = names
            .filter((name) => process.env[name])
            .map((name) => `${name}=${JSON.stringify(process.env[name])}`)
            .join('\n') + '\n';
          const target = path.join(process.env.RELEASE_PATH, '.env.production');
          fs.writeFileSync(target, contents, { mode: 0o600 });
          NODE

      - name: Activate release with PM2
        env:
          RELEASE_PATH: ${{ steps.release.outputs.release_path }}
        run: |
          export DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ln -sfn "$RELEASE_PATH" "$DEPLOY_PATH/current"
          npx --no-install pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          npx --no-install pm2 save

      - name: Verify active release
        run: |
          node <<'NODE'
          const expectedSha = process.env.GITHUB_SHA;
          const port = process.env.APP_PORT;
          const url = `http://127.0.0.1:${port}/api/version`;
          const deadline = Date.now() + 30_000;

          async function verify() {
            let lastError;

            while (Date.now() < deadline) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                const body = await response.json();

                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}`);
                }

                if (body.sha !== expectedSha) {
                  throw new Error(
                    `commit mismatch: expected ${expectedSha}, received ${body.sha}`,
                  );
                }

                console.log(`Release ${body.sha} aktif di port ${port}`);
                return;
              } catch (error) {
                lastError = error;
                await new Promise((resolve) => setTimeout(resolve, 1_000));
              }
            }

            throw new Error(`Deployment verification failed: ${lastError}`);
          }

          verify().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
